[package]
name = "osza-netmon"
version = "0.1.0"
edition = "2024"
# MSRV: the highest rust-version declared anywhere in the locked
# dependency tree (uuid 1.29.0 -> 1.89.0), verified with a real
# `cargo build --locked` under rustc 1.89.0. See
# docs/reports/T-000/execution-01.md for the determination method.
rust-version = "1.89"
description = "A lightweight terminal application that discovers devices on the local IPv4 network and shows what is known about them"
repository = "https://github.com/osza-tools/osza-netmon"
readme = "README.md"
license = "GPL-3.0-only"
publish = false

[dependencies]
# ratatui is pinned to an exact version (plan §9.1); thiserror is a caret
# requirement. Cargo.lock is committed, so both resolve versions are
# fixed. Resolved versions are recorded in docs/reports/T-000/execution-01.md.
ratatui = "=0.30.2"
thiserror = "2"
# Interface enumeration via getifaddrs(3) — the safe wrapper ADR-017 chose
# after the §9.2 evaluation (docs/adr/017-interface-data-source.md and
# docs/reports/T-101/execution-01.md §7). Exact pin like ratatui; only the
# "net" feature is enabled (no fs/ioctl/event/... code compiled in).
# Manager approval recorded as PQ-1 in the T-101 execution report.
nix = { version = "=0.31.3", default-features = false, features = ["net"] }

[lints.rust]
# plan §7 SR-01: no unsafe anywhere in this package.
unsafe_code = "forbid"

[lints.clippy]
# plan §7 SR-02/SR-03 and §11.3. Test-only relief is configured in
# clippy.toml (allow-*-in-tests); main.rs holds the one narrowly scoped
# allow for print_stdout/print_stderr at the CLI boundary.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
