[package]
name = "osza-netmon"
version = "0.1.0"
edition = "2024"
# MSRV: the highest rust-version declared anywhere in the locked
# dependency tree (uuid 1.29.0 -> 1.89.0), verified with a real
# `cargo build --locked` under rustc 1.89.0. See
# docs/reports/T-000/execution-01.md for the determination method.
rust-version = "1.89"
description = "A lightweight terminal application that discovers devices on the local IPv4 network and shows what is known about them"
repository = "https://github.com/osza-tools/osza-netmon"
readme = "README.md"
license = "GPL-3.0-only"
publish = false

[dependencies]
# ratatui is pinned to an exact version (plan §9.1); thiserror is a caret
# requirement. Cargo.lock is committed, so both resolve versions are
# fixed. Resolved versions are recorded in docs/reports/T-000/execution-01.md.
ratatui = "=0.30.2"
thiserror = "2"
# Interface enumeration via getifaddrs(3) — the safe wrapper ADR-017 chose
# after the §9.2 evaluation (docs/adr/017-interface-data-source.md and
# docs/reports/T-101/execution-01.md §7). Exact pin like ratatui; only the
# "net" and "process" features are enabled (no fs/ioctl/event/... code
# compiled in). Manager approval recorded as PQ-1 in the T-101 execution
# report. T-104 (PQ-1 of its report) additionally enables "process" for
# nix::sys::prctl::set_no_new_privs (ADR-005 step 3) — same crate, same
# pinned version, no new transitive dependency.
nix = { version = "=0.31.3", default-features = false, features = ["net", "process"] }
# Production ArpTransport (task T-104): opens and binds the AF_PACKET
# socket (the only candidate of §9.1's transport list whose bind/send/recv
# path needs no `unsafe` of our own — nix and socket2 expose no safe
# sockaddr_ll constructor; see the §9.2 evaluation in
# docs/reports/T-104/execution-01.md §7). Exact pin like ratatui and nix.
# PROVISIONAL per ADR-009 (Pending, decided by T-105): fully hidden
# behind the ArpTransport trait so the library can be replaced in one
# module. Manager approval recorded as PQ-1 in the T-104 execution report.
pnet_datalink = "=0.35.0"
# Capability dropping (ADR-005 step 3, task T-104): effective/permitted/
# inheritable/ambient (+ bounding when CAP_SETPCAP is held) via the safe
# caps:: API. Chosen over capctl per the §9.2 evaluation in
# docs/reports/T-104/execution-01.md §7 (fresh release line, libc-only
# transitive). Exact pin like the other task-approved crates. Manager
# approval recorded as PQ-1 in the T-104 execution report.
caps = "=0.5.6"

[lints.rust]
# plan §7 SR-01: no unsafe anywhere in this package.
unsafe_code = "forbid"

[lints.clippy]
# plan §7 SR-02/SR-03 and §11.3. Test-only relief is configured in
# clippy.toml (allow-*-in-tests); main.rs holds the one narrowly scoped
# allow for print_stdout/print_stderr at the CLI boundary.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
