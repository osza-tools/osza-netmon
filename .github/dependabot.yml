version: 2
updates:
  # Rust dependencies (Cargo.toml requirements + Cargo.lock).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  # CI actions. Workflow actions are pinned by commit SHA with the
  # human-readable tag in a trailing comment; Dependabot updates the
  # SHAs and keeps the comments in sync.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
